  schemas:
    quickBookEvent:
      type: object
      description: A single CloudEvents-formatted QuickBooks webhook notification.
      required:
        - specversion
        - id
        - source
        - type
        - time
        - intuitentityid
        - intuitaccountid
      properties:
        specversion:
          type: string
          description: The CloudEvents specification version (currently always "1.0").
        id:
          type: string
          description: A unique identifier for this event.
        source:
          type: string
          description: Identifies the QuickBooks company instance that raised the event.
        type:
          type: string
          description: The entity and operation this event represents, e.g. qbo.customer.created.v1.
        datacontenttype:
          type: string
          description: The content type of the data field.
        time:
          type: string
          description: The timestamp the event occurred, in ISO 8601 format.
        intuitentityid:
          type: string
          description: The ID of the entity that changed.
        intuitaccountid:
          type: string
          description: The QuickBooks company (realm) ID this event belongs to.
        data:
          type: object
          additionalProperties: true
          description: >-
            Operation-specific event data. Confirmed shapes so far: empty on create,
            {"deletedId": "..."} on merge. Shape for update/delete/void/email is not
            yet confirmed against a real delivery.
